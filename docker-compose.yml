version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: kalyan_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kalyan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kalyan_secure_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-kalyan_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kalyan} -d ${POSTGRES_DB:-kalyan_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: kalyan_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kalyan_worker
    restart: unless-stopped
    command: python -m arq backend.app.core.worker.WorkerSettings
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-kalyan}:${POSTGRES_PASSWORD:-kalyan_secure_pass_2026}@postgres:5432/${POSTGRES_DB:-kalyan_db}
      REDIS_URL: redis://redis:6379/0
      APP_ENV: production
      ENVIRONMENT: production

volumes:
  postgres_data:
  redis_data:
